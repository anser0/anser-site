<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="author" content="{{ config.author }}">
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
  <meta name="keywords" content="{{ config.extra.keywords }}">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Lora:ital,wght@0,400..700;1,400..700&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Noto+Serif:ital,wght@0,100..900;1,100..900&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ get_url(path='style.css', cachebust=true) }}">
  {% block head %}{% endblock head %}
</head>
<body class="bg-white-100">
  <div class="bg-gray-50/90 border-b border-gray-200">
    <header class="container m-auto py-4 px-6 md:px-20 md:py-6 text-gray-800">
      <div class="flex items-center justify-between space-x-4">
        <div class="space-y-1">
          <h1 class="text-2xl font-medium tracking-tighter sm:text-3xl md:text-4xl">
            <a href="{{ get_url(path='/', trailing_slash=true) }}">{{ config.title }}</a>
          </h1>
        </div>
        {% include "partials/nav.html" %}
      </div>
    </header>
  </div>
  <main class="container m-auto py-6 px-6 md:px-20 lg:py-12">
    {% block content %}{% endblock content %}
  </main>
</body>
</html>
