# The URL the site will be built for
base_url = "https://anserena.com"

title = "Serena An"
description = "Serena An's personal website"
author = "Serena An"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

taxonomies = [{ name = "tags", paginate_by = 10 }]

# Feeds are opted into per section; only content/blog has generate_feeds set.
feed_filenames = ["atom.xml", "rss.xml"]

[markdown]
# Turn `:smile:` style shortcodes into emoji
render_emoji = false

# Collect footnotes at the end of the page and add back-references
bottom_footnotes = true

[markdown.highlighting]
theme = "catppuccin-mocha"

[extra]
keywords = "anser, Serena An, MIT, math"
